services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: froa-server:latest
    container_name: froa-server
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: "file:./data/app.db"
      STORAGE_DRIVER: local
      STORAGE_DIR: ./data/audio
      BACKUP_DIR: ./data/backups
      WEB_ORIGIN: http://localhost:4000
      JWT_SECRET: change-me-in-production-this-is-a-dev-secret
      ASR_PROVIDER: manual
      MAX_UPLOAD_MB: "100"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  # 可选：切换到 PostgreSQL 时使用
  #   docker compose --profile postgres up -d
  #   并把 DATABASE_URL 改为 postgresql://froa:froa@db:5432/froa
  db:
    image: postgres:16-alpine
    container_name: froa-db
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: froa
      POSTGRES_PASSWORD: froa
      POSTGRES_DB: froa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
